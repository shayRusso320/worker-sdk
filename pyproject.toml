[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-worker-sdk"
dynamic = ["version"]
description = "Production-grade Python SDK for running Temporal workers with zero boilerplate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Finubit", email = "dev@finubit.com"}
]
keywords = ["temporal", "workflow", "distributed-systems", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "temporalio>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "prometheus-client>=0.17.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/finubit/temporal-worker-sdk"
Documentation = "https://github.com/finubit/temporal-worker-sdk#readme"
Repository = "https://github.com/finubit/temporal-worker-sdk.git"
Issues = "https://github.com/finubit/temporal-worker-sdk/issues"

[tool.setuptools]
packages = ["temporal_worker_sdk"]

[tool.setuptools.dynamic.version]
file = "temporal_worker_sdk/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'
